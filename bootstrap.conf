build_aux=build-aux  # Use our build-aux dir

# We ask gnulib-tool to put the installed gnulib sources under ./gl/ by setting gl_base.
#
# The bootstrap script calls aclocal -I m4, so we put gnulib's m4
# there (by setting m4_base=m4) instead of beneath gl/m4 for example.

gl_base=gl
source_base="${gl_base}/lib"
tests_base="${gl_base}/tests"
doc_base="${gl_base}/doc"
m4_base="m4"
local_gl_dir="gnulib-local"
ACLOCAL_FLAGS="-I unit-tests/googletest/googletest/m4"

gnulib_name=libgnulib
gnulib_mk=Makefile.am
mkdir -p "${doc_base}" "${m4_base}" "${source_base}" "${tests_base}"

# We don't need these modules.
avoided_gnulib_modules=''

# These modules are obsolete and can probably be removed soon,
# but leave them in for now to minimize changes.
obsolete_gnulib_modules=''

# gnulib modules needed only for maintainer things.
maintainer_modules='
gitlog-to-changelog
maintainer-makefile
update-copyright
gendocs
gnupload
readme-release
gnu-web-doc-update
'
# gnulib modules used by this package.
gnulib_modules="
aligned_alloc
canonicalize
ctype
dirent-safer
errno
fcntl
fdl
fseek
getopt
gettext-h
maintainer-makefile
manywarnings
progname
pthread
regex
signal
stdio
string
std-gnu11
stdarg
stdlib
sys_file
sys_stat
sys_wait
time
unistd
warnings
$maintainer_modules
"

# Automake requires that ChangeLog exists.  We create it dynamically
# using the gitlog-to-changelog module, but Automake doesn't know
# that.  So create the file if it doesn't exist.  Try to ensure
# that it has an "old" timestamp as a hint to humans.
if ! [ -e ChangeLog ]; then
   echo 'This file will be dynamically generated by "make dist"' > ChangeLog
   touch -r ChangeLog.3 ChangeLog 2>/dev/null
fi

# Other locale categories that need message catalogs.
EXTRA_LOCALE_CATEGORIES=LC_TIME

# Additional xgettext options to use.  Use "\\\newline" to break lines.
XGETTEXT_OPTIONS=$XGETTEXT_OPTIONS'\\\
 --flag=asnprintf:3:c-format\\\
 --flag=asprintf:2:c-format\\\
 --flag=error:3:c-format\\\
 --flag=error_at_line:5:c-format\\\
 --flag=vasnprintf:3:c-format\\\
 --flag=vasprintf:2:c-format\\\
 --flag=verror:3:c-format\\\
 --flag=verror_at_line:5:c-format\\\
 --flag=wrapf:1:c-format\\\
 --flag=xasprintf:1:c-format\\\
 --flag=xfprintf:2:c-format\\\
 --flag=xprintf:1:c-format\\\
 --from-code=UTF-8\\\
'

# Append these, since we use the propername module.
see_manual='"This is a proper name. See the gettext manual, section Names."'
see_manual=\'"$see_manual"\'
XGETTEXT_OPTIONS=$XGETTEXT_OPTIONS'\\\
 --keyword=proper_name:1,'"$see_manual"'\\\
 --keyword=proper_name_utf8:1,'"$see_manual"'\\\
'

# If "AM_GNU_GETTEXT(external" or "AM_GNU_GETTEXT([external]"
# appears in configure.ac, exclude some unnecessary files.
# Without grep's -E option (not portable enough, pre-configure),
# the following test is ugly.  Also, this depends on the existence
# of configure.ac, not the obsolescent-named configure.in.  But if
# you're using this infrastructure, you should care about such things.

gettext_external=0
grep '^[	 ]*AM_GNU_GETTEXT(external\>' configure.ac > /dev/null &&
  gettext_external=1
grep '^[	 ]*AM_GNU_GETTEXT(\[external\]' configure.ac > /dev/null &&
  gettext_external=1

if test $gettext_external = 1; then
  # Gettext supplies these files, but we don't need them since
  # we don't have an intl subdirectory.
  excluded_files='
      m4/glibc2.m4
      m4/intdiv0.m4
      m4/lcmessage.m4
      m4/uintmax_t.m4
      m4/ulonglong.m4
      m4/visibility.m4
  '
fi

gnulib_tool_option_extras="--with-tests"

# Build prerequisites.  You might actually be able to use older
# versions of some of these tools.  But these are the versions that I
# know will work.
buildreq="\
autoconf   2.71
automake   1.16.5
autopoint  -
libtool    2.4.7
bison      -
gettext    -
git        2.39.2
gperf      -
gzip       -
makeinfo   -
perl       5.36
rsync      -
tar        -
"

install_gl_makefile_am() {
    dest="gl/Makefile.am"
    source="${build_aux}/Makefile.am.for_gl"
    if ! [ -e  ]
    then
        echo "Overwriting: ${source} -> ${dest}"
    else
        echo "Copying: ${source} -> ${dest}"
    fi
    cp "${source}" "${dest}"

    # autoreconf also wants gl/doc/Makefile.in to exist.
    for f in gl/doc/Makefile.am
    do
	echo "bootstrap.conf: Creating ${f}"
        echo '## Created by bootstrap.conf' >| "${f}"
    done

}

set_up_googletest_submodule() {
    git submodule init   -- 'unit-tests/googletest' || exit $?
    git submodule update -- 'unit-tests/googletest' || exit $?
    for needed in 'unit-tests/googletest/googletest/m4/acx_pthread.m4'
    do
        if ! [ -e "${needed}" ]
        then
            echo "${needed} does not exist, but this is needed to successfully configure googletest" >&2
            exit 1
        fi
    done
}

bootstrap_post_import_hook() {
      install_gl_makefile_am || exit $?
      set_up_googletest_submodule || exit $?
}

bootstrap_epilogue() {
    perl -pi -e "s/\@PACKAGE\@/$package/g" README-release
}
